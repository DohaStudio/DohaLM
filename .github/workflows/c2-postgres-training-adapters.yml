name: C2 PostgreSQL Training Adapters

on:
  pull_request:
    paths:
      - ".github/workflows/c2-postgres-training-adapters.yml"
      - "requirements-c2.in"
      - "requirements-c2.lock"
      - "src/training/postgres_training_adapters.py"
      - "src/training/dataset_training_entry.py"
      - "src/training/production_host_foundation.py"
      - "src/training/production_orchestration_seams.py"
      - "src/postgres_migrations/**"
      - "tests/test_postgres_c1*.py"
      - "tests/test_postgres_c2*.py"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/c2-postgres-training-adapters.yml"
      - "requirements-c2.in"
      - "requirements-c2.lock"
      - "src/training/postgres_training_adapters.py"
      - "src/training/dataset_training_entry.py"
      - "src/training/production_host_foundation.py"
      - "src/training/production_orchestration_seams.py"
      - "src/postgres_migrations/**"
      - "tests/test_postgres_c1*.py"
      - "tests/test_postgres_c2*.py"

permissions:
  contents: read

concurrency:
  group: c2-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-c2.lock
      - name: Install hash-locked C2 dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-c2.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Smoke import production C2 adapter
        run: |
          python -c "import importlib; import src.training.postgres_training_adapters as adapter; importlib.reload(adapter)"
          python -c "import src.training.postgres_training_adapters"
      - name: Verify C2 Ruff contract
        run: |
          python -m ruff check src/training/postgres_training_adapters.py tests/test_postgres_c2.py tests/test_postgres_c2_integration.py
          python -m ruff format --check src/training/postgres_training_adapters.py tests/test_postgres_c2.py tests/test_postgres_c2_integration.py
      - name: Run C2 unit contracts
        run: python -m pytest tests/test_postgres_c2.py -q
      - name: Run C2 PostgreSQL integration contracts
        run: python -m pytest tests/test_postgres_c2_integration.py -q
      - name: Run explicit C1 regression
        run: python -m pytest tests/test_postgres_c1.py tests/test_postgres_c1_integration.py -q
      - name: Compile C2 Python boundary
        run: python -m compileall -q src/training/postgres_training_adapters.py tests/test_postgres_c2.py tests/test_postgres_c2_integration.py
      - name: Verify disposable resource cleanup
        if: always()
        shell: bash
        run: |
          test -z "$(docker ps -aq --filter label=com.dohastudio.c1.correlation)"
          test -z "$(docker volume ls -q --filter label=com.dohastudio.c1.correlation)"
          test -z "$(docker network ls -q --filter label=com.dohastudio.c1.correlation)"
