name: C2 PostgreSQL Training Adapters

on:
  pull_request: {}
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: c2-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: C2 PostgreSQL Training Adapters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Classify C2 PostgreSQL paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "c2_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          is_c2_path() {
            case "$1" in
              .github/workflows/c2-postgres-training-adapters.yml|requirements-c2.in|requirements-c2.lock|src/training/postgres_training_adapters.py|src/training/production_composition.py|src/training/production_full_pretraining_host.py|src/training/execution_issuer.py|src/training/dataset_training_entry.py|src/training/production_host_foundation.py|src/training/production_orchestration_seams.py|src/postgres_migrations/*|src/data/postgres_dataset_proposal_authority.py|src/data/postgres_dataset_review_authority.py|tests/test_postgres_c1*.py|tests/test_postgres_c2*.py|tests/test_postgres_c3*.py|tests/test_production_host_foundation.py|tests/test_production_orchestration_seams.py|tests/test_production_full_pretraining_host.py|tests/test_training_execution_issuer.py)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          c2_changed=false
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            if is_c2_path "$path"; then
              c2_changed=true
              break
            fi
            case "$status" in
              R*|C*)
                IFS= read -r -d '' new_path
                if is_c2_path "$new_path"; then
                  c2_changed=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-status --diff-filter=ACMRD -z "$BASE_SHA...HEAD")
          echo "c2_changed=$c2_changed" >> "$GITHUB_OUTPUT"
      - name: Confirm no C2 PostgreSQL changes
        if: steps.changes.outputs.c2_changed == 'false'
        run: echo "No C2 PostgreSQL changes detected; check succeeds without heavy regression."
      - name: Set up Python 3.12
        if: steps.changes.outputs.c2_changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-c2.lock
      - name: Install hash-locked C2 dependencies
        if: steps.changes.outputs.c2_changed == 'true'
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-c2.lock
      - name: Verify dependency consistency
        if: steps.changes.outputs.c2_changed == 'true'
        run: python -m pip check
      - name: Smoke import production C2 and C3 boundaries
        if: steps.changes.outputs.c2_changed == 'true'
        run: |
          python -c "import importlib; import src.training.postgres_training_adapters as adapter; importlib.reload(adapter)"
          python -c "import src.training.postgres_training_adapters"
          python -c "import importlib; import src.training.production_composition as composition; importlib.reload(composition)"
          python -c "import src.training.production_composition"
      - name: Verify C2 Ruff contract
        if: steps.changes.outputs.c2_changed == 'true'
        run: |
          python -m ruff check src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_full_pretraining_host.py src/training/execution_issuer.py tests/test_postgres_c2.py tests/test_postgres_c2_integration.py tests/test_postgres_c3.py tests/test_postgres_c3_integration.py
          python -m ruff format --check src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_full_pretraining_host.py src/training/execution_issuer.py tests/test_postgres_c2.py tests/test_postgres_c2_integration.py tests/test_postgres_c3.py tests/test_postgres_c3_integration.py
      - name: Run C2 unit contracts
        if: steps.changes.outputs.c2_changed == 'true'
        run: python -m pytest tests/test_postgres_c2.py -q
      - name: Run C2 PostgreSQL integration contracts
        if: steps.changes.outputs.c2_changed == 'true'
        run: python -m pytest tests/test_postgres_c2_integration.py -q
      - name: Run C3 composition unit contracts
        if: steps.changes.outputs.c2_changed == 'true'
        run: python -m pytest tests/test_postgres_c3.py -q
      - name: Run C3 PostgreSQL composition contracts
        if: steps.changes.outputs.c2_changed == 'true'
        run: python -m pytest tests/test_postgres_c3_integration.py -q
      - name: Run C3 Host lifecycle regressions
        if: steps.changes.outputs.c2_changed == 'true'
        run: python -m pytest tests/test_production_host_foundation.py tests/test_production_orchestration_seams.py tests/test_production_full_pretraining_host.py tests/test_training_execution_issuer.py -q
      - name: Compile C2 Python boundary
        if: steps.changes.outputs.c2_changed == 'true'
        run: python -m compileall -q src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_full_pretraining_host.py src/training/execution_issuer.py tests/test_postgres_c2.py tests/test_postgres_c2_integration.py tests/test_postgres_c3.py tests/test_postgres_c3_integration.py
      - name: Verify disposable resource cleanup
        if: always() && steps.changes.outputs.c2_changed == 'true'
        shell: bash
        run: |
          containers="$(docker ps -aq --filter label=com.dohastudio.c1.correlation)"
          volumes="$(docker volume ls -q --filter label=com.dohastudio.c1.correlation)"
          networks="$(docker network ls -q --filter label=com.dohastudio.c1.correlation)"
          if [ -n "$containers$volumes$networks" ]; then
            echo "POSTGRES_CLEANUP_RESIDUE label=com.dohastudio.c1.correlation containers=${containers:-none} volumes=${volumes:-none} networks=${networks:-none}" >&2
            exit 1
          fi
