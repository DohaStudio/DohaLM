name: C1 PostgreSQL contract

on:
  pull_request: {}
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: c1-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: C1 PostgreSQL Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Classify C1 PostgreSQL paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          c1_changed=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/c1-postgres-contract.yml|.github/workflows/c2-postgres-training-adapters.yml|pyproject.toml|requirements-c1.lock|src/postgres_c1.py|src/postgres_migrations/*|src/data/postgres_dataset_proposal_authority.py|src/data/postgres_dataset_review_authority.py|src/training/production_authority_provisioning.py|src/training/postgres_production_authority_provisioning.py|src/training/production_intent_authority.py|src/training/postgres_training_intent_authority.py|tests/test_postgres_c1*.py|tests/test_production_authority_provisioning.py|tests/test_training_intent_authority.py)
                c1_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRD -z "$BASE_SHA...HEAD")
          echo "c1_changed=$c1_changed" >> "$GITHUB_OUTPUT"
      - name: Confirm no C1 PostgreSQL changes
        if: steps.changes.outputs.c1_changed == 'false'
        run: echo "No C1 PostgreSQL changes detected; check succeeds without heavy regression."
      - name: Set up Python 3.12
        if: steps.changes.outputs.c1_changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-c1.lock
      - name: Install test and hash-locked C1 dependencies
        if: steps.changes.outputs.c1_changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-c1.lock
      - name: Run C1 PostgreSQL contracts
        if: steps.changes.outputs.c1_changed == 'true'
        run: python -m pytest tests/test_postgres_c1.py tests/test_postgres_c1_integration.py -q
      - name: Verify disposable resource cleanup
        if: always() && steps.changes.outputs.c1_changed == 'true'
        shell: bash
        run: |
          containers="$(docker ps -aq --filter label=com.dohastudio.c1.correlation)"
          volumes="$(docker volume ls -q --filter label=com.dohastudio.c1.correlation)"
          networks="$(docker network ls -q --filter label=com.dohastudio.c1.correlation)"
          if [ -n "$containers$volumes$networks" ]; then
            echo "POSTGRES_CLEANUP_RESIDUE label=com.dohastudio.c1.correlation containers=${containers:-none} volumes=${volumes:-none} networks=${networks:-none}" >&2
            exit 1
          fi
