name: C1 PostgreSQL contract

on:
  pull_request:
    paths:
      - ".github/workflows/c1-postgres-contract.yml"
      - "pyproject.toml"
      - "requirements-c1.lock"
      - "src/training/postgres_c1.py"
      - "src/training/postgres_migrations/**"
      - "tests/test_postgres_c1*.py"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/c1-postgres-contract.yml"
      - "pyproject.toml"
      - "requirements-c1.lock"
      - "src/training/postgres_c1.py"
      - "src/training/postgres_migrations/**"
      - "tests/test_postgres_c1*.py"

permissions:
  contents: read

concurrency:
  group: c1-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-c1.lock
      - name: Install test and hash-locked C1 dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-c1.lock
      - name: Run C1 PostgreSQL contracts
        run: python -m pytest tests/test_postgres_c1.py tests/test_postgres_c1_integration.py -q
      - name: Verify disposable resource cleanup
        if: always()
        shell: bash
        run: |
          test -z "$(docker ps -aq --filter label=com.dohastudio.c1.correlation)"
          test -z "$(docker volume ls -q --filter label=com.dohastudio.c1.correlation)"
          test -z "$(docker network ls -q --filter label=com.dohastudio.c1.correlation)"
