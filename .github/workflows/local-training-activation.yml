name: Local Single-User Training Activation

on:
  pull_request:
    paths:
      - ".github/workflows/local-training-activation.yml"
      - "configs/local-training-*.example.json"
      - "configs/full-pretraining-continuation.example.yaml"
      - "docs/training/local-single-user-activation.md"
      - "docs/training/full-pretraining-one-epoch-continuation.md"
      - "scripts/training/run_full_pretraining.py"
      - "src/training/checkpoint.py"
      - "src/training/execution_approval.py"
      - "src/training/full_pretraining.py"
      - "src/training/full_pretraining_backend.py"
      - "src/training/local_activation.py"
      - "src/training/postgres_training_adapters.py"
      - "src/training/production_composition.py"
      - "src/training/production_host_foundation.py"
      - "src/training/production_orchestration_seams.py"
      - "src/training/scheduler.py"
      - "src/training/trainer.py"
      - "tests/fixtures/local_training_activation_mapping.json"
      - "tests/test_local_training_activation*.py"
      - "tests/test_full_pretraining_continuation.py"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/local-training-activation.yml"
      - "configs/local-training-*.example.json"
      - "configs/full-pretraining-continuation.example.yaml"
      - "docs/training/local-single-user-activation.md"
      - "docs/training/full-pretraining-one-epoch-continuation.md"
      - "scripts/training/run_full_pretraining.py"
      - "src/training/checkpoint.py"
      - "src/training/execution_approval.py"
      - "src/training/full_pretraining.py"
      - "src/training/full_pretraining_backend.py"
      - "src/training/local_activation.py"
      - "src/training/postgres_training_adapters.py"
      - "src/training/production_composition.py"
      - "src/training/production_host_foundation.py"
      - "src/training/production_orchestration_seams.py"
      - "src/training/scheduler.py"
      - "src/training/trainer.py"
      - "tests/fixtures/local_training_activation_mapping.json"
      - "tests/test_local_training_activation*.py"
      - "tests/test_full_pretraining_continuation.py"

permissions:
  contents: read

concurrency:
  group: local-activation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Local Training Activation Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-c2.lock
      - name: Install existing hash-locked C2 dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-c2.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify local activation style
        run: |
          python -m ruff check src/training/checkpoint.py src/training/execution_approval.py src/training/full_pretraining.py src/training/full_pretraining_backend.py src/training/local_activation.py src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_host_foundation.py src/training/production_orchestration_seams.py src/training/scheduler.py src/training/trainer.py scripts/training/run_full_pretraining.py tests/test_full_pretraining_continuation.py tests/test_local_training_activation.py tests/test_local_training_activation_integration.py
          python -m ruff format --check src/training/checkpoint.py src/training/execution_approval.py src/training/full_pretraining.py src/training/full_pretraining_backend.py src/training/local_activation.py src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_host_foundation.py src/training/production_orchestration_seams.py src/training/scheduler.py src/training/trainer.py scripts/training/run_full_pretraining.py tests/test_full_pretraining_continuation.py tests/test_local_training_activation.py tests/test_local_training_activation_integration.py
      - name: Run local activation unit contracts
        run: python -m pytest tests/test_local_training_activation.py -q
      - name: Run exact r3 one-epoch continuation contracts
        run: python -m pytest tests/test_full_pretraining_continuation.py -q
      - name: Run local durable PostgreSQL contract
        run: python -m pytest tests/test_local_training_activation_integration.py -q
      - name: Run C1 C2 C3 direct regressions
        run: |
          python -m pytest tests/test_postgres_c1.py tests/test_postgres_c1_integration.py -q
          python -m pytest tests/test_postgres_c2.py -q
          python -m pytest tests/test_postgres_c2_integration.py -q
          python -m pytest tests/test_postgres_c3.py -q
          python -m pytest tests/test_postgres_c3_integration.py -q
      - name: Run Host activation and lifecycle regressions
        run: python -m pytest tests/test_production_host_foundation.py tests/test_production_orchestration_seams.py tests/test_production_full_pretraining_host.py tests/test_training_execution_issuer.py tests/test_dataset_training_activation.py -q
      - name: Compile local activation boundary
        run: python -m compileall -q src/training/checkpoint.py src/training/execution_approval.py src/training/full_pretraining.py src/training/full_pretraining_backend.py src/training/local_activation.py src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_host_foundation.py src/training/production_orchestration_seams.py src/training/scheduler.py src/training/trainer.py scripts/training/run_full_pretraining.py
      - name: Verify task resource cleanup
        if: always()
        shell: bash
        run: |
          test -z "$(docker ps -aq --filter label=com.dohastudio.local-training.activation)"
          test -z "$(docker volume ls -q --filter label=com.dohastudio.local-training.activation)"
          test -z "$(docker network ls -q --filter label=com.dohastudio.local-training.activation)"
          test -z "$(docker ps -aq --filter label=com.dohastudio.c1.correlation)"
          test -z "$(docker volume ls -q --filter label=com.dohastudio.c1.correlation)"
          test -z "$(docker network ls -q --filter label=com.dohastudio.c1.correlation)"
