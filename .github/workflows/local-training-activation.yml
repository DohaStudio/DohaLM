name: Local Single-User Training Activation

on:
  pull_request: {}
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: local-activation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Local Training Activation Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Classify Local Training Activation paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "training_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          is_training_path() {
            case "$1" in
              .github/ci/training-test-manifest.json|.github/workflows/local-training-activation.yml|pyproject.toml|requirements-c2.in|requirements-c2.lock|configs/local-training-*.example.json|configs/full-pretraining*.yaml|configs/pilot-pretraining*.yaml|configs/training/*|docs/training/local-single-user-activation.md|docs/training/full-pretraining-one-epoch-continuation.md|scripts/ci/training_test_manifest.py|scripts/training/*|src/training/*|src/model/*|src/postgres_c1.py|src/postgres_migrations/*|src/data/aihub_71748_tokenizer_corpus.py|src/data/checksums.py|src/data/common_dataset_contracts.py|src/data/tokenized_dataset.py|src/runtime/environment.py|src/runtime/paths.py|src/tokenizer/operating.py|tests/_training_helpers.py|tests/fixtures/local_training_activation_mapping.json|tests/test_*training*.py|tests/test_*pretraining*.py|tests/test_production_host_foundation.py|tests/test_production_orchestration_seams.py|tests/test_production_full_pretraining_host.py)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          training_changed=false
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            if is_training_path "$path"; then
              training_changed=true
              break
            fi
            case "$status" in
              R*|C*)
                IFS= read -r -d '' new_path
                if is_training_path "$new_path"; then
                  training_changed=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-status --diff-filter=ACMRD --find-renames --find-copies-harder -z "$BASE_SHA...HEAD")
          echo "training_changed=$training_changed" >> "$GITHUB_OUTPUT"
      - name: Validate Training test ownership manifest
        run: python3 scripts/ci/training_test_manifest.py --manifest .github/ci/training-test-manifest.json validate
      - name: Confirm no Local Training Activation changes
        if: steps.changes.outputs.training_changed == 'false'
        run: echo "No Local Training Activation changes detected; check succeeds without heavy regression."
      - name: Set up Python 3.12
        if: steps.changes.outputs.training_changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-c2.lock
      - name: Install existing hash-locked C2 dependencies
        if: steps.changes.outputs.training_changed == 'true'
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-c2.lock
      - name: Verify dependency consistency
        if: steps.changes.outputs.training_changed == 'true'
        run: python -m pip check
      - name: Verify local activation style
        if: steps.changes.outputs.training_changed == 'true'
        run: |
          python -m ruff check src/training/checkpoint.py src/training/execution_approval.py src/training/full_pretraining.py src/training/full_pretraining_backend.py src/training/local_activation.py src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_host_foundation.py src/training/production_orchestration_seams.py src/training/scheduler.py src/training/trainer.py scripts/ci/training_test_manifest.py scripts/training/run_full_pretraining.py tests/test_full_pretraining_continuation.py tests/test_local_training_activation.py tests/test_local_training_activation_integration.py tests/test_training_test_manifest.py
          python -m ruff format --check src/training/checkpoint.py src/training/execution_approval.py src/training/full_pretraining.py src/training/full_pretraining_backend.py src/training/local_activation.py src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_host_foundation.py src/training/production_orchestration_seams.py src/training/scheduler.py src/training/trainer.py scripts/ci/training_test_manifest.py scripts/training/run_full_pretraining.py tests/test_full_pretraining_continuation.py tests/test_local_training_activation.py tests/test_local_training_activation_integration.py tests/test_training_test_manifest.py
      - name: Run local activation unit contracts
        if: steps.changes.outputs.training_changed == 'true'
        run: |
          mapfile -d '' -t targets < <(python3 scripts/ci/training_test_manifest.py emit-required --group local_activation)
          ((${#targets[@]} > 0))
          python -m pytest "${targets[@]}" -q
      - name: Run exact r3 one-epoch continuation contracts
        if: steps.changes.outputs.training_changed == 'true'
        run: |
          mapfile -d '' -t targets < <(python3 scripts/ci/training_test_manifest.py emit-required --group continuation)
          ((${#targets[@]} > 0))
          python -m pytest "${targets[@]}" -q
      - name: Run local durable PostgreSQL contract
        if: steps.changes.outputs.training_changed == 'true'
        run: |
          mapfile -d '' -t targets < <(python3 scripts/ci/training_test_manifest.py emit-required --group postgres_activation)
          ((${#targets[@]} > 0))
          python -m pytest "${targets[@]}" -q
      - name: Run newly covered Training critical regressions
        if: steps.changes.outputs.training_changed == 'true'
        run: |
          mapfile -d '' -t targets < <(python3 scripts/ci/training_test_manifest.py emit-required --group critical)
          ((${#targets[@]} > 0))
          python -m pytest "${targets[@]}" -q
      - name: Run Training ownership manifest guard contracts
        if: steps.changes.outputs.training_changed == 'true'
        run: |
          mapfile -d '' -t targets < <(python3 scripts/ci/training_test_manifest.py emit-required --group manifest_guard)
          ((${#targets[@]} > 0))
          python -m pytest "${targets[@]}" -q
      - name: Run Host activation and lifecycle regressions
        if: steps.changes.outputs.training_changed == 'true'
        run: |
          mapfile -d '' -t targets < <(python3 scripts/ci/training_test_manifest.py emit-required --group host)
          ((${#targets[@]} > 0))
          python -m pytest "${targets[@]}" -q
      - name: Compile local activation boundary
        if: steps.changes.outputs.training_changed == 'true'
        run: python -m compileall -q src/training/checkpoint.py src/training/execution_approval.py src/training/full_pretraining.py src/training/full_pretraining_backend.py src/training/local_activation.py src/training/postgres_training_adapters.py src/training/production_composition.py src/training/production_host_foundation.py src/training/production_orchestration_seams.py src/training/scheduler.py src/training/trainer.py scripts/ci/training_test_manifest.py scripts/training/run_full_pretraining.py
      - name: Verify task resource cleanup
        if: always() && steps.changes.outputs.training_changed == 'true'
        shell: bash
        run: |
          verify_no_residue() {
            label="$1"
            containers="$(docker ps -aq --filter "label=$label")"
            volumes="$(docker volume ls -q --filter "label=$label")"
            networks="$(docker network ls -q --filter "label=$label")"
            if [ -n "$containers$volumes$networks" ]; then
              echo "POSTGRES_CLEANUP_RESIDUE label=$label containers=${containers:-none} volumes=${volumes:-none} networks=${networks:-none}" >&2
              return 1
            fi
          }
          verify_no_residue com.dohastudio.local-training.activation
          verify_no_residue com.dohastudio.c1.correlation
