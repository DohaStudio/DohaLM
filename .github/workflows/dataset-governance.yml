name: Dataset Governance

on:
  pull_request: {}
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: dataset-governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dataset-governance:
    name: Dataset Governance Unit / Publication
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Classify Dataset Governance paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          dataset_changed=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/dataset-governance.yml|docs/quality/test-strategy.md|pyproject.toml|src/data/*|src/training/dataset_publication_authority_bridge.py|tests/test_dataset_*.py|tests/test_product_dataset_*.py|tests/test_common_dataset_contracts.py|tests/dataset_publication_process_worker.py)
                dataset_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRD -z "$BASE_SHA...HEAD")
          echo "dataset_changed=$dataset_changed" >> "$GITHUB_OUTPUT"

      - name: Confirm no Dataset Governance changes
        if: steps.changes.outputs.dataset_changed == 'false'
        run: echo "No Dataset Governance changes detected; required check succeeds without heavy regression."

      - name: Set up Python 3.12
        if: steps.changes.outputs.dataset_changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install minimal Dataset dependencies
        if: steps.changes.outputs.dataset_changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==8.4.2 \
            ruff==0.15.22 \
            PyYAML==6.0.3 \
            https://github.com/DohaStudio/.github/releases/download/dohastudio-common-ai-contracts-v0.1.0/dohastudio_common_ai_contracts-0.1.0-py3-none-any.whl
          python -m pip check

      - name: Check Dataset static contract
        if: steps.changes.outputs.dataset_changed == 'true'
        run: |
          ruff check --select E4,E7,E9,F \
            src/data/common_dataset_contracts.py \
            src/data/dataset_governance.py \
            src/data/dataset_proposal_authority.py \
            src/data/dataset_review_authority.py \
            src/data/dataset_publication.py \
            src/data/product_dataset_composition.py \
            src/data/product_dataset_governance.py \
            src/data/product_dataset_review.py \
            src/data/product_dataset_approval.py \
            src/data/product_dataset_publication.py \
            src/data/postgres_dataset_proposal_authority.py \
            src/data/postgres_dataset_review_authority.py \
            src/data/product_dataset_authority_registration.py \
            src/training/dataset_publication_authority_bridge.py \
            tests/test_common_dataset_contracts.py \
            tests/test_dataset_governance.py \
            tests/test_dataset_proposal_authority.py \
            tests/test_dataset_review_authority.py \
            tests/test_dataset_publication.py \
            tests/test_product_dataset_composition.py \
            tests/test_product_dataset_governance.py \
            tests/test_product_dataset_review.py \
            tests/test_product_dataset_approval.py \
            tests/test_product_dataset_publication.py \
            tests/test_dataset_publication_process.py \
            tests/test_dataset_publication_authority_registration.py \
            tests/dataset_publication_process_worker.py

      - name: Check Dataset format contract
        if: steps.changes.outputs.dataset_changed == 'true'
        run: |
          ruff format --check \
            src/data/common_dataset_contracts.py \
            src/data/dataset_governance.py \
            src/data/dataset_proposal_authority.py \
            src/data/dataset_review_authority.py \
            src/data/dataset_publication.py \
            src/data/product_dataset_composition.py \
            src/data/product_dataset_governance.py \
            src/data/product_dataset_review.py \
            src/data/product_dataset_approval.py \
            src/data/product_dataset_publication.py \
            src/data/postgres_dataset_proposal_authority.py \
            src/data/postgres_dataset_review_authority.py \
            src/data/product_dataset_authority_registration.py \
            src/training/dataset_publication_authority_bridge.py \
            tests/test_common_dataset_contracts.py \
            tests/test_dataset_governance.py \
            tests/test_dataset_proposal_authority.py \
            tests/test_dataset_review_authority.py \
            tests/test_dataset_publication.py \
            tests/test_product_dataset_composition.py \
            tests/test_product_dataset_governance.py \
            tests/test_product_dataset_review.py \
            tests/test_product_dataset_approval.py \
            tests/test_product_dataset_publication.py \
            tests/test_dataset_publication_process.py \
            tests/test_dataset_publication_authority_registration.py \
            tests/dataset_publication_process_worker.py

      - name: Check changed Dataset source static contract
        if: steps.changes.outputs.dataset_changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed_source=()
          while IFS= read -r -d '' path; do
            if [[ "$path" == *.py ]]; then
              changed_source+=("$path")
            fi
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...HEAD" -- src/data src/training/dataset_publication_authority_bridge.py)
          if ((${#changed_source[@]})); then
            ruff check --select E4,E7,E9,F -- "${changed_source[@]}"
            ruff format --check -- "${changed_source[@]}"
          fi

      - name: Check changed Dataset test static contract
        if: steps.changes.outputs.dataset_changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed_tests=()
          while IFS= read -r -d '' path; do
            case "$path" in
              tests/test_dataset_*.py|tests/test_product_dataset_*.py|tests/test_common_dataset_contracts.py|tests/dataset_publication_process_worker.py)
                changed_tests+=("$path")
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...HEAD" -- tests)
          if ((${#changed_tests[@]})); then
            ruff check --select E4,E7,E9,F -- "${changed_tests[@]}"
            ruff format --check -- "${changed_tests[@]}"
          fi

      - name: Run Dataset Governance unit regression
        if: steps.changes.outputs.dataset_changed == 'true'
        shell: bash
        run: |
          unit_tests=("tests/test_common_dataset_contracts.py")
          while IFS= read -r -d '' path; do
            case "$path" in
              tests/test_dataset_publication_process.py|tests/test_dataset_training_*.py)
                continue
                ;;
            esac
            unit_tests+=("$path")
          done < <(find tests -maxdepth 1 -type f \( -name 'test_dataset_*.py' -o -name 'test_product_dataset_*.py' \) -print0 | sort -z)
          python -m pytest -q -- "${unit_tests[@]}"

      - name: Run publication process regression
        if: steps.changes.outputs.dataset_changed == 'true'
        run: python -m pytest -q tests/test_dataset_publication_process.py

      - name: Compile and import Dataset Governance modules
        if: steps.changes.outputs.dataset_changed == 'true'
        run: |
          python -m compileall -q src/data
          python -c "import src.data.dataset_governance, src.data.dataset_proposal_authority, src.data.dataset_review_authority, src.data.dataset_publication, src.data.product_dataset_review, src.data.product_dataset_approval, src.data.product_dataset_publication"

      - name: Check patch whitespace
        if: steps.changes.outputs.dataset_changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "$BASE_SHA...HEAD"
