name: Dataset Governance

on:
  pull_request:
    paths:
      - ".github/workflows/dataset-governance.yml"
      - "docs/quality/test-strategy.md"
      - "pyproject.toml"
      - "src/data/**"
      - "tests/test_dataset_*.py"
      - "tests/test_product_dataset_*.py"
      - "tests/test_common_dataset_contracts.py"
      - "tests/dataset_publication_process_worker.py"
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/dataset-governance.yml"
      - "docs/quality/test-strategy.md"
      - "pyproject.toml"
      - "src/data/**"
      - "tests/test_dataset_*.py"
      - "tests/test_product_dataset_*.py"
      - "tests/test_common_dataset_contracts.py"
      - "tests/dataset_publication_process_worker.py"

permissions:
  contents: read

concurrency:
  group: dataset-governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dataset-governance:
    name: Dataset Governance Unit / Publication
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install minimal Dataset dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==8.4.2 \
            ruff==0.15.22 \
            PyYAML==6.0.3 \
            https://github.com/DohaStudio/.github/releases/download/dohastudio-common-ai-contracts-v0.1.0/dohastudio_common_ai_contracts-0.1.0-py3-none-any.whl
          python -m pip check

      - name: Check Dataset static contract
        run: |
          ruff check --select E4,E7,E9,F \
            src/data/common_dataset_contracts.py \
            src/data/dataset_governance.py \
            src/data/dataset_proposal_authority.py \
            src/data/dataset_review_authority.py \
            src/data/dataset_publication.py \
            src/data/product_dataset_composition.py \
            src/data/product_dataset_governance.py \
            src/data/product_dataset_review.py \
            src/data/product_dataset_approval.py \
            src/data/product_dataset_publication.py \
            src/data/postgres_dataset_proposal_authority.py \
            src/data/postgres_dataset_review_authority.py \
            tests/test_common_dataset_contracts.py \
            tests/test_dataset_governance.py \
            tests/test_dataset_proposal_authority.py \
            tests/test_dataset_review_authority.py \
            tests/test_dataset_publication.py \
            tests/test_product_dataset_composition.py \
            tests/test_product_dataset_governance.py \
            tests/test_product_dataset_review.py \
            tests/test_product_dataset_approval.py \
            tests/test_product_dataset_publication.py \
            tests/test_dataset_publication_process.py \
            tests/dataset_publication_process_worker.py

      - name: Check Dataset format contract
        run: |
          ruff format --check \
            src/data/common_dataset_contracts.py \
            src/data/dataset_governance.py \
            src/data/dataset_proposal_authority.py \
            src/data/dataset_review_authority.py \
            src/data/dataset_publication.py \
            src/data/product_dataset_composition.py \
            src/data/product_dataset_governance.py \
            src/data/product_dataset_review.py \
            src/data/product_dataset_approval.py \
            src/data/product_dataset_publication.py \
            src/data/postgres_dataset_proposal_authority.py \
            src/data/postgres_dataset_review_authority.py \
            tests/test_common_dataset_contracts.py \
            tests/test_dataset_governance.py \
            tests/test_dataset_proposal_authority.py \
            tests/test_dataset_review_authority.py \
            tests/test_dataset_publication.py \
            tests/test_product_dataset_composition.py \
            tests/test_product_dataset_governance.py \
            tests/test_product_dataset_review.py \
            tests/test_product_dataset_approval.py \
            tests/test_product_dataset_publication.py \
            tests/test_dataset_publication_process.py \
            tests/dataset_publication_process_worker.py

      - name: Check changed Dataset source static contract
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed_source=()
          while IFS= read -r -d '' path; do
            if [[ "$path" == *.py ]]; then
              changed_source+=("$path")
            fi
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...HEAD" -- src/data)
          if ((${#changed_source[@]})); then
            ruff check --select E4,E7,E9,F -- "${changed_source[@]}"
            ruff format --check -- "${changed_source[@]}"
          fi

      - name: Run Dataset Governance unit regression
        run: |
          python -m pytest -q \
            tests/test_common_dataset_contracts.py \
            tests/test_dataset_governance.py \
            tests/test_dataset_proposal_authority.py \
            tests/test_dataset_review_authority.py \
            tests/test_dataset_publication.py \
            tests/test_product_dataset_composition.py \
            tests/test_product_dataset_governance.py \
            tests/test_product_dataset_review.py \
            tests/test_product_dataset_approval.py \
            tests/test_product_dataset_publication.py

      - name: Run publication process regression
        run: python -m pytest -q tests/test_dataset_publication_process.py

      - name: Compile and import Dataset Governance modules
        run: |
          python -m compileall -q src/data
          python -c "import src.data.dataset_governance, src.data.dataset_proposal_authority, src.data.dataset_review_authority, src.data.dataset_publication, src.data.product_dataset_review, src.data.product_dataset_approval, src.data.product_dataset_publication"

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "$BASE_SHA...HEAD"
