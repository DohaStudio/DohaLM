[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dohalm"
version = "0.1.0"
description = "한국어 소형 언어 모델을 처음부터 구현하고 학습하는 프로젝트"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.7,<2.8",
    "numpy>=1.26,<3",
]
dev = ["pytest>=8,<9"]

[project.scripts]
dohalm = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=tests/tmp"
