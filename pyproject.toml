[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dohalm"
version = "0.1.0"
description = "한국어 소형 언어 모델을 처음부터 구현하고 학습하는 프로젝트"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PyYAML>=6.0,<7",
    "sentencepiece==0.2.2",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.7,<2.8",
    "numpy>=1.26,<3",
]
dev = ["pytest>=8,<9"]
api = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.30,<1",
]
inference = [
    "accelerate==1.12.0",
    "bitsandbytes==0.48.2",
    "torch>=2.7,<2.8",
    "transformers==4.57.6",
]

[project.scripts]
dohalm = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=tests/tmp"
markers = [
    "gpu: requires the explicitly enabled local CUDA model environment",
]
