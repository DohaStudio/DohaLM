  - candidate_id
  - run_id
  - approved_action
  - approved_optimizer_steps
  - approved_scheduled_tokens
  - approved_token_budget
  - resolved_config_fingerprint
  - dataset_fingerprint
  - split_fingerprint
  - packing_fingerprint
  - tokenizer_fingerprint
  - model_fingerprint
