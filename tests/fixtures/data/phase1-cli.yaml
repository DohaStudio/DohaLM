data:
  dataset_id: fixture-dataset
  dataset_version: cli-smoke-v1
  input_paths:
    - tests/fixtures/data/happy
  allowed_formats:
    - .txt
    - .jsonl
  output_dir: tests/tmp/phase1-output
  encoding: utf-8
  unicode_normalization: NFC
  max_text_chars: 1000000
  metadata_max_depth: 5
  reject_unknown_fields: true
  write_empty_split_files: true
  checksum_algorithm: sha256
  split:
    seed: 42
    train_ratio: 0.8
    validation_ratio: 0.1
    test_ratio: 0.1
    ratio_tolerance: 1.0e-9
  source:
    license_status: approved
    approval_status: approved
    pii_status: clear
