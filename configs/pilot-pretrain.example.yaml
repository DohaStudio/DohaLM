train_dataset: data/tokenized/pilot/train.jsonl
validation_dataset: data/tokenized/pilot/validation.jsonl
tokenizer_model: artifacts/tokenizer-pilot/tokenizer.model
corpus_manifest: data/tokenized/pilot/corpus-manifest.json
split_manifest: data/tokenized/pilot/split-manifest.json
output_dir: experiments/pilot-pretraining
micro_batch_size: 2
gradient_accumulation_steps: 4
max_steps: 100
validation_every: 10
save_every: 25
learning_rate: 0.0003
weight_decay: 0.1
warmup_steps: 10
min_lr_ratio: 0.1
scheduler_type: cosine
max_grad_norm: 1.0
seed: 17
device: cuda
use_amp: true
num_workers: 0
pin_memory: true
local_experiment_only: true
publish_allowed: false
redistribution_allowed: false
model_release_allowed: false
prompt: 한국어
max_new_tokens: 16
